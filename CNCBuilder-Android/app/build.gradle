plugins {
    id 'com.android.application'
}

android {
    namespace 'com.marveltech.cncbuilder'
    compileSdk 35

    defaultConfig {
        applicationId "com.marveltech.cncbuilder"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
